<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mata Sang Kesatria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <!-- KIRI: dunia game -->
    <section class="game-panel">
      <header class="game-head">
        <div class="title-wrap">
          <h1 id="stageTitle">STAGE 1</h1>
          <div class="stage-sub" id="stageSub"></div>
        </div>
        <div class="head-actions">
          <button class="btn" id="btnStages" title="Pilih stage">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Pilih stage</span>
          </button>
          <button class="btn icon" id="btnMute" title="Suara">
            <svg viewBox="0 0 24 24" id="muteIcon"></svg>
          </button>
        </div>
      </header>
      <div class="hud">
        <div class="chip" id="timer" title="Waktu menyusun (berhenti saat program berjalan)"></div>
        <div class="chip" id="starGoal"></div>
        <div class="chip" id="blockCount"></div>
      </div>
      <div class="viewport" id="viewport">
        <div class="concept" id="concept"></div>
        <button class="hint-btn" id="btnHint" title="Minta petunjuk">👸 Petunjuk</button>
        <div class="toast" id="toast"></div>
        <div class="dialog" id="dialog" hidden>
          <div class="portrait" id="dlgIcon"></div>
          <div class="dlg-body">
            <div class="dlg-name" id="dlgName"></div>
            <div class="dlg-text" id="dlgText"></div>
          </div>
          <button class="dlg-next" id="dlgNext">Lanjut ›</button>
        </div>
      </div>
    </section>

    <!-- KANAN: blok programming -->
    <aside class="code-panel">
      <div class="section">
        <h2>Blok</h2>
        <p class="sub">Klik untuk menambah · Seret untuk mengatur</p>
        <div class="palette" id="palette"></div>
      </div>

      <div class="section grow">
        <div class="prog-head">
          <h2>Program</h2>
          <button class="link-btn" id="btnClear">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            <span id="clearLabel">Hapus semua</span>
          </button>
        </div>
        <div class="program" id="program"></div>
      </div>

      <div class="run-bar">
        <button class="run" id="btnRun">
          <svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
          JALANKAN
        </button>
        <button class="btn icon square" id="btnReset" title="Hentikan &amp; kembali ke awal">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <label class="speed">
          <span>Kecepatan:</span>
          <input type="range" id="speed" min="1" max="5" value="2" />
        </label>
      </div>
    </aside>
  </div>

  <!-- Layar judul -->
  <div class="overlay title-screen" id="titleOverlay">
    <div class="title-card">
      <div class="title-icon">🛡️👸</div>
      <h1 id="gameTitle"></h1>
      <p class="tagline">Jadilah mata bagi sang kesatria. Susun perintah, keluarlah dari kastil.</p>
      <div class="title-actions">
        <button class="run" id="btnPlay">MULAI</button>
        <button class="btn" id="btnTitleStages">Pilih stage</button>
        <button class="btn" id="btnProlog">Prolog</button>
      </div>
      <p class="credit">Game edukasi STEM · Engineering</p>
    </div>
  </div>

  <!-- Cutscene -->
  <div class="overlay story" id="storyOverlay" hidden>
    <div class="story-card">
      <div class="story-label" id="storyLabel"></div>
      <p class="story-text" id="storyText"></p>
      <div class="story-actions">
        <button class="link-btn" id="storySkip">Lewati</button>
        <span class="story-dots" id="storyDots"></span>
        <button class="run small" id="storyNext">Lanjut ›</button>
      </div>
    </div>
  </div>

  <!-- Pilih stage -->
  <div class="overlay" id="stageOverlay" hidden>
    <div class="modal wide">
      <h2>Pilih stage</h2>
      <div class="stage-grid" id="stageGrid"></div>
      <button class="btn" id="btnCloseStages">Tutup</button>
    </div>
  </div>

  <!-- Menang -->
  <div class="overlay" id="winOverlay" hidden>
    <div class="modal">
      <h2>Stage selesai!</h2>
      <div class="win-stars" id="winStars"></div>
      <p id="winText"></p>
      <p class="win-eng" id="winEng"></p>
      <div class="modal-actions">
        <button class="btn" id="btnStay">Ulangi</button>
        <button class="run small" id="btnNext">Lanjut ›</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
